# A visitor clicks a move in README.md -> GitHub opens a pre-filled issue -> this workflow plays it,
# lets the bot answer, replies to and closes the issue right away, then redraws the board and commits as the profile owner.
# The "New game" link (title chess|newgame) only resets the board when the profile owner opened the issue.
name: Chess move

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-main
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -q -r tools/requirements.txt

      - name: Play the move
        id: play
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: python tools/chess_game.py "$TITLE" "$PLAYER" reply.md

      # Answer first, so the player sees the bot's move without waiting for the redraw.
      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          CHANGED: ${{ steps.play.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            printf '\n<sub>The board on the profile updates within a few seconds.</sub>\n' >> reply.md
          fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file reply.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Redraw README
        if: steps.play.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Reuse the profile data the daily refresh stored on the output branch; fetch it live only if missing.
          mkdir -p .cache
          if git fetch -q --depth=1 origin output \
             && git show FETCH_HEAD:cache/profile.json > .cache/profile.json \
             && git show FETCH_HEAD:cache/avatar.jpg > .cache/avatar.jpg; then
            echo "Using cached profile data"
          else
            python tools/fetch_data.py "$GITHUB_REPOSITORY_OWNER" .cache
          fi
          python tools/gen_assets.py .cache . .art

      - name: Commit as the profile owner
        if: steps.play.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.play.outputs.summary }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git config user.name "$GITHUB_REPOSITORY_OWNER"
          git config user.email "${OWNER_ID}+${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
          git add -A README.md assets data
          git diff --cached --quiet || git commit -q -m "$SUMMARY"
          git push

      - name: Report a failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Something went wrong while updating the board. Please try again from the profile in a minute."
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" || true
