# A visitor clicks a move in README.md -> GitHub opens a pre-filled issue -> this workflow plays it,
# lets the bot answer, redraws the board, commits as the profile owner, then replies to and closes the issue.
# The "New game" link (title chess|newgame) only resets the board when the profile owner opened the issue.
name: Chess move

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-main
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install chess==1.11.2

      - name: Play the move
        id: play
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: python tools/chess_game.py "$TITLE" "$PLAYER" reply.md

      - name: Redraw README
        if: steps.play.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/fetch_data.py "$GITHUB_REPOSITORY_OWNER" .cache
          python tools/gen_assets.py .cache . .art

      - name: Commit as the profile owner
        if: steps.play.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.play.outputs.summary }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git config user.name "$GITHUB_REPOSITORY_OWNER"
          git config user.email "${OWNER_ID}+${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
          git add -A README.md assets data
          git diff --cached --quiet || git commit -q -m "$SUMMARY"
          git push

      - name: Reply and close the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          [ -f reply.md ] || echo "Something went wrong while playing this move. Please try again from the board." > reply.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file reply.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
