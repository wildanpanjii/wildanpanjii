# Redraws the data-driven art (title sequence, lead card, repo cards, galaxy, contribution city) from live GitHub data,
# plays a new Hard bot vs Hard bot chess game for the animated replay, and publishes it all to the "output" branch as a single commit, so the daily refresh never adds commits to main.
# README.md on main is only committed when its text actually changes (for example a new repository card).
name: Refresh profile art

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: profile-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -q -r tools/requirements.txt

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/fetch_data.py "$GITHUB_REPOSITORY_OWNER" .cache
          python tools/gen_assets.py .cache . .art

      - name: Play today's bot vs bot chess game
        env:
          REPLAY_SECONDS: "3"
        run: cd tools && python chess_replay.py ../.art

      - name: Publish art to the output branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          cd .art
          git init -q -b output
          git config user.name "$GITHUB_REPOSITORY_OWNER"
          git config user.email "${OWNER_ID}+${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
          git add -A
          git commit -q -m "Profile art"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output

      - name: Commit README if its text changed
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git config user.name "$GITHUB_REPOSITORY_OWNER"
          git config user.email "${OWNER_ID}+${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
          git add -A README.md assets
          git diff --cached --quiet || { git commit -q -m "Refresh profile README" && git push; }
