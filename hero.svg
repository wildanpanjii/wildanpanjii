<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="GitHub Pictures presents Wildan Panji">
<style>
  .cap { opacity: 0; animation: fade 1.4s ease-out .2s forwards; }
  .ttl { opacity: 0; animation: rise 1.5s cubic-bezier(.2,.7,.2,1) .8s forwards; }
  .sub { opacity: 0; animation: fade 1.4s ease-out 1.8s forwards; }
  .roll { animation: roll 14s linear -3s infinite; }
  .credits { opacity: 0; animation: fade 1.2s ease-out 2.2s forwards; }
  .shine { animation: shine 7s ease-in-out 3s infinite both; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes roll { from { transform: translateY(144px); } to { transform: translateY(-130px); } }
  @keyframes shine { 0% { transform: translateX(-200px); } 35%, 100% { transform: translateX(1300px); } }
</style>
<defs>
  <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d6ebf8"/><stop offset="0.45" stop-color="#63bcec"/>
  <stop offset="0.56" stop-color="#2da5e5"/><stop offset="1" stop-color="#1887c3"/></linearGradient>
  <clipPath id="frame"><rect width="900" height="500" rx="16"/></clipPath>
  <clipPath id="tclip"><text x="450" y="226" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="1">WILDAN PANJI</text></clipPath>
  <radialGradient id="warm" cx="50%" cy="46%" r="62%">
    <stop offset="0" stop-color="#143252"/><stop offset="0.55" stop-color="#121a26"/><stop offset="1" stop-color="#010409"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="72%">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.7"/>
  </radialGradient>
  <linearGradient id="rollfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.3" stop-color="#fff"/>
    <stop offset="0.75" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="rollmask" maskUnits="userSpaceOnUse" x="0" y="298" width="900" height="144">
    <rect x="0" y="298" width="900" height="144" fill="url(#rollfade)"/>
  </mask>
</defs>
<g clip-path="url(#frame)">
