>WILDAN PANJI</text><text x="450" y="226" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="1" fill="url(#goldText)" stroke="#e1f0fa" stroke-opacity="0.35" stroke-width="0.7">WILDAN PANJI</text>
    <g clip-path="url(#tclip)"><g transform="skewX(-22)"><rect class="shine" x="0" y="80" width="70" height="230" fill="#fff" fill-opacity="0.6"/></g></g>
  </g>
  <text class="sub" x="450" y="276" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="6" fill="#e6edf3">TYPESCRIPT · GO DEVELOPER</text>
  <g class="credits"><g mask="url(#rollmask)"><g transform="translate(0 298)"><g class="roll"><text x="450" y="22" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#e6edf3"><tspan fill-opacity="0.72">starring </tspan><tspan font-weight="700">TubesKursusInAlpro2</tspan><tspan fill-opacity="0.72"> · ★ 1</tspan></text><text x="450" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#e6edf3"><tspan fill-opacity="0.72">starring </tspan><tspan font-weight="700">Uang-Papi</tspan><tspan fill-opacity="0.72"> · TypeScript</tspan></text><text x="450" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#e6edf3"><tspan fill-opacity="0.72">filmed on location in </tspan><tspan font-weight="700">Bandung</tspan><tspan fill-opacity="0.72"></tspan></text><text x="450" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#e6edf3"><tspan fill-opacity="0.72">a </tspan><tspan font-weight="700">Telkom University</tspan><tspan fill-opacity="0.72"> production</tspan></text></g></g></g></g>
